    <path d="M40 0H0V40" fill="none" stroke="#1b2350" stroke-width=".6" opacity=".55"/>
  </pattern></defs>
<line x1="0" y1="12" x2="1200" y2="12" stroke="#1f2a66" stroke-width="2"/>
