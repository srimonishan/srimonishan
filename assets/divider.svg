<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03050d"/><stop offset=".55" stop-color="#070b1d"/><stop offset="1" stop-color="#0b0620"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff3cac"/>
    <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="node" cx=".5" cy=".5" r=".5">
